[project]
name = "ntd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pytest>=8.3",
    "python-dotenv>=1.0",
    "allure-pytest>=2.13",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "pydantic>=2.7",
]

[tool.pytest.ini_options]
addopts = "--alluredir=allure-results --clean-alluredir"
testpaths = ["tests"]
markers = [
    "smoke: fast sanity checks",
    "regression: full CRUD coverage",
    "schema_validation: response structure validation",
]
